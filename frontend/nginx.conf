server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 6m;   # photo uploads (API limit is 5 MB)

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
  }

  location / {
    try_files $uri /index.html;   # SPA routes such as /finance reload cleanly
  }
}
