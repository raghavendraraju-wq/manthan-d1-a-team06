# Draft alert rules. Thresholds agreed: refund success < 95% over 5 min;
# gateway p95 latency > 5 s for 5 min.
# Metric names are the contract the app's /metrics exporter must publish:
#   returnright_refunds_total{outcome="succeeded|declined|timeout|error"}   (counter)
#   returnright_gateway_request_duration_seconds_bucket{le="..."}          (histogram)
groups:
  - name: returnright-refunds
    rules:
      - alert: RefundSuccessRateLow
        expr: |
          sum(rate(returnright_refunds_total{outcome="succeeded"}[5m]))
            / sum(rate(returnright_refunds_total[5m])) < 0.95
        labels:
          severity: critical
        annotations:
          summary: Refund success rate below 95% over the last 5 minutes
          runbook: docs/runbook.md#refund-success-rate

      - alert: GatewayLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(returnright_gateway_request_duration_seconds_bucket[5m]))) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Payment gateway p95 latency above 5 s for 5 minutes
          runbook: docs/runbook.md#gateway-latency
